      <stop offset="100%" stop-color="#3D5A80"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#29B6F6" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#29B6F6"/>
